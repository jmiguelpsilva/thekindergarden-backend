# === BASE / COMMON CONFIG ===
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# =====================================================
#       ╶┬┐┌─╴╷ ╷   ┌─╴┌┐╷╷ ╷
#        ││├╴ │┌┘   ├╴ │└┤│┌┘
#       ╶┴┘└─╴└┘    └─╴╵ ╵└┘
# =====================================================
# POSTGRESQL DATABASE
%dev.quarkus.datasource.username = ${DB_USER}
%dev.quarkus.datasource.password = ${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url = jdbc:postgresql://kindergarden-db:5432/postgres

%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.baseline-on-migrate=true
%prod.quarkus.flyway.locations=classpath:db/migration/family,classpath:db/migration/financial,classpath:db/migration/product,classpath:db/migration/supplier
%prod.quarkus.flyway.schemas=family,financial,product,supplier

# OPENAPI & SWAGGER-UI
%dev.quarkus.smallrye-openapi.info-title=Kindergarden-API (development)
%dev.quarkus.smallrye-openapi.info-description=Where childs can't play with fire, but can play with code...
%dev.quarkus.smallrye-openapi.path=/openapi
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.swagger-ui.path=/swagger-ui

